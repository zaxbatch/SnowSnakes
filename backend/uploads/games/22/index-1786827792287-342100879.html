<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🐕 Dog Fun Zone – Awesome Random Dog Facts & Pics!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #f9e7b3 0%, #f5cda0 100%);
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Poppins', cursive, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        /* Main app card */
        .app-container {
            max-width: 650px;
            width: 100%;
            background-color: #fffef7;
            border-radius: 68px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2), 0 8px 12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.2s ease;
            border: 3px solid #ffbc6e;
        }

        .header {
            background-color: #ff9f4a;
            padding: 20px 25px;
            text-align: center;
            border-bottom: 5px solid #ffd966;
        }

        .header h1 {
            font-size: 2.4rem;
            letter-spacing: 2px;
            color: white;
            text-shadow: 4px 4px 0 #c45c00;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header p {
            background-color: #ffedb5;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 60px;
            font-weight: bold;
            color: #aa5e1b;
            margin-top: 8px;
            font-size: 1rem;
        }

        /* content area */
        .content {
            padding: 30px 28px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* dog image box */
        .image-box {
            background: #fef2df;
            border-radius: 58px;
            padding: 18px;
            box-shadow: inset 0 0 0 3px white, 0 12px 18px rgba(0,0,0,0.1);
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .dog-img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 48px;
            object-fit: cover;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            background-color: #ffe2bc;
            width: auto;
            height: auto;
            transition: transform 0.2s;
            border: 4px solid white;
        }

        .dog-img:hover {
            transform: scale(1.02);
        }

        /* fact bubble */
        .fact-bubble {
            background: #fff2db;
            border-radius: 48px;
            padding: 20px 20px;
            position: relative;
            border-left: 13px solid #ffb347;
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.05);
            width: 100%;
        }

        .fact-bubble h3 {
            font-size: 1.6rem;
            color: #c25d00;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .fact-text {
            font-size: 1.35rem;
            line-height: 1.45;
            color: #2e241f;
            background: #fff2df;
            padding: 12px 10px;
            border-radius: 32px;
            font-weight: 500;
            word-break: break-word;
        }

        /* loader and error style */
        .loader {
            font-size: 1.3rem;
            background: #ffe0b5;
            padding: 14px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .error-message {
            background-color: #ffe1cf;
            color: #be3b00;
            border-radius: 40px;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 1.2rem;
            border-left: 8px solid #ff6b4a;
        }

        /* button style - super friendly */
        .fetch-btn {
            background-color: #ffb347;
            border: none;
            padding: 14px 32px;
            font-size: 1.6rem;
            font-weight: bold;
            font-family: inherit;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            box-shadow: 0 7px 0 #a55300;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .fetch-btn:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #a55300;
        }

        .fetch-btn:hover {
            background-color: #ffa01e;
        }

        /* footer note */
        .footer {
            background-color: #fce5c1;
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #9b5a2c;
            border-top: 2px dashed #ffbc6e;
        }

        @media (max-width: 550px) {
            .content {
                padding: 20px;
            }
            .fact-text {
                font-size: 1.1rem;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .fetch-btn {
                font-size: 1.3rem;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>
            🐶 Dog Zone 🐾
        </h1>
        <p>✨ Random dog + cool facts ✨</p>
    </div>

    <div class="content">
        <!-- Dog Image Display -->
        <div class="image-box">
            <img id="dogImage" class="dog-img"
                 src="https://images.dog.ceo/breeds/shiba/shiba-12.jpg"
                 alt="Cute random dog"
                 onerror="this.onerror=null; this.src='https://images.dog.ceo/breeds/hound-afghan/n02088094_1003.jpg';">
        </div>

        <!-- Fact Display Section -->
        <div class="fact-bubble">
            <h3>📖 Did you know? 🐕</h3>
            <div id="factArea" class="fact-text">
                ⭐ Click the big button to get a dog fact & a new dog picture! ⭐
            </div>
        </div>

        <!-- Big Playful Button -->
        <button id="newDogBtn" class="fetch-btn">
            🐕‍🦺 New Dog + Fact 🧠
        </button>
        <div id="statusMessage" style="font-size: 0.9rem; color: #bc7000; margin-top: 5px;"></div>
    </div>
    <div class="footer">
        🐩 Using free Dog CEO API 🐕 & Dog Facts API — totally free & fun!
    </div>
</div>

<script>
    // ---------- 🌟 WELCOME TO OUR API FUN ZONE! 🌟 ----------
    // We use TWO super simple free APIs:
    // 1. Dog CEO API → gives random dog picture (always works, no key needed!)
    // 2. Dog Facts API → gives interesting facts about dogs (free, no key needed!)
    //
    // We'll make our page show a brand new dog photo and a brand new dog fact every time
    // you click the big orange button! Perfect for 5th grade and dog lovers.
    // -------------------------------------------------------

    // Get the HTML elements we need to change
    const dogImage = document.getElementById('dogImage');
    const factArea = document.getElementById('factArea');
    const fetchButton = document.getElementById('newDogBtn');
    const statusMsg = document.getElementById('statusMessage');

    // We'll also keep track so we don't show too many loading messages
    let isLoading = false;   // prevents double-clicking while loading

    // ---------- FUNCTION 1: Fetch a random dog image from Dog CEO API ----------
    // The API endpoint: https://dog.ceo/api/breeds/image/random
    // It gives back JSON like: {"message":"https://...jpg", "status":"success"}
    async function fetchRandomDogImage() {
        try {
            const response = await fetch('https://dog.ceo/api/breeds/image/random');
            // If the server response is not okay (like 404, 500), throw error
            if (!response.ok) {
                throw new Error(`Image API error: ${response.status}`);
            }
            const data = await response.json();   // parse JSON
            // data.message is the image URL! It's super simple.
            if (data.status === 'success' && data.message) {
                return data.message;
            } else {
                throw new Error('Unexpected image data');
            }
        } catch (error) {
            console.error('Failed to load dog image:', error);
            // If error happens, we return null to handle it later
            return null;
        }
    }

    // ---------- FUNCTION 2: Fetch a random dog fact from Dog Facts API ----------
    // There is a free, public API: https://dogapi.dog/api/v2/facts
    // it returns JSON with data: [ { attributes: { body: "fact text" } } ]
    // OR we can also use another free alternative: https://dog-facts-api.herokuapp.com/api/v1/resources/dogs?number=1
    // To be super reliable, we'll use the second one (more 5th-grade friendly) + a backup fallback fact.
    // But wait! dog-facts-api sometimes has CORS? Actually it works in most browsers! Let's also add fallback.
    // Let's use "https://dog-api.kinduff.com/api/facts" which is super simple! Returns { facts: ["text"] }
    // That one is famous and very beginner-friendly. We'll use that: free, no key, CORS enabled.
    async function fetchRandomDogFact() {
        try {
            // Using the public Dog Facts API from kinduff (very reliable and simple!)
            const response = await fetch('https://dog-api.kinduff.com/api/facts');
            if (!response.ok) {
                throw new Error(`Fact API error: ${response.status}`);
            }
            const data = await response.json();
            // The response format: { facts: ["Here is a fact about dogs...."] , success: true }
            if (data.facts && Array.isArray(data.facts) && data.facts.length > 0) {
                return data.facts[0];   // first fact from the array
            } else {
                throw new Error('No fact array found');
            }
        } catch (error) {
            console.warn('Could not fetch from main fact API, using backup:', error);
            // Backup: we have a small list of super fun dog facts (so the app never breaks)
            return getBackupDogFact();
        }
    }

    // Backup facts just in case internet is weird or API is sleepy
    function getBackupDogFact() {
        const backupFacts = [
            "🐾 Dogs have a sense of smell that's 10,000 times stronger than humans!",
            "🎾 A dog's nose print is unique, just like a human fingerprint.",
            "💤 Dogs dream like humans! If you see paws twitching, they might be chasing squirrels.",
            "🌍 The Basenji dog breed doesn't bark — it yodels!",
            "🏃 Dalmatians are born completely white, and their spots appear as they grow older.",
            "🐩 Dogs can understand up to 250 words and gestures!",
            "❤️ Science shows that petting a dog lowers your blood pressure.",
            "🐕 A dog’s whiskers help them 'see' in the dark by sensing air currents."
        ];
        // pick random index
        const randomIndex = Math.floor(Math.random() * backupFacts.length);
        return backupFacts[randomIndex] + " (🐕 fun backup fact!)";
    }

    // ---------- FUNCTION 3: Update the whole UI with fresh image and fact ----------
    async function refreshDogContent() {
        // Don't allow multiple clicks while loading
        if (isLoading) {
            statusMsg.innerText = "🐕 Just a sec, doggo is running....!";
            return;
        }

        isLoading = true;
        fetchButton.disabled = true;   // disable button while loading
        statusMsg.innerText = "🔄 Fetching a brand new doggy and fact... 🐾";
        factArea.innerHTML = "🤔 Loading a cool dog fact... 🐶";
        // Optional: show a loading placeholder on image? but we keep current image for now

        try {
            // We run both API calls at the same time (faster!)
            // Promise.all lets us wait for both image and fact to finish
            const [imageUrl, factText] = await Promise.all([
                fetchRandomDogImage(),
                fetchRandomDogFact()
            ]);

            // Update the dog image if we got a valid URL
            if (imageUrl) {
                dogImage.src = imageUrl;
                dogImage.alt = "Random cute dog photo";
                // handle image error: if for some reason the image fails to load, set a default friendly image
                dogImage.onerror = () => {
                    console.log("Image failed to load, using backup dog image");
                    dogImage.src = "https://images.dog.ceo/breeds/poodle-toy/n02113624_7377.jpg";
                };
            } else {
                // if imageUrl is null (API failed), use a safe fallback image (cute poodle)
                dogImage.src = "https://images.dog.ceo/breeds/poodle-toy/n02113624_4943.jpg";
                statusMsg.innerText = "✨ Image used a backup cutie! ✨";
            }

            // Update fact area with the fact we received
            if (factText) {
                factArea.innerHTML = `🐕 ${factText}`;
            } else {
                factArea.innerHTML = "🐕 Dogs are amazing friends! They love belly rubs and snacks! 🦴";
            }

            statusMsg.innerText = "✅ New doggo is here! 🎉 Click again!";
            // Clear success message after 2 seconds but keep friendly
            setTimeout(() => {
                if (statusMsg.innerText === "✅ New doggo is here! 🎉 Click again!") {
                    statusMsg.innerText = "";
                }
            }, 2500);
        } catch (error) {
            console.error("Something went wrong while refreshing:", error);
            // Nice error message that is not scary for kids
            factArea.innerHTML = "🐕 Woof! The internet got a little tangled. But dogs are still the best! 🦴 Click again!";
            // Also set a default dog picture if both APIs seem down
            dogImage.src = "https://images.dog.ceo/breeds/terrier-norwich/n02094258_227.jpg";
            statusMsg.innerText = "💡 Tip: Click again! APIs sometimes need a second try! 💡";
        } finally {
            // re-enable everything
            isLoading = false;
            fetchButton.disabled = false;
        }
    }

    // ----- HELPER: Preload a nice first load when the page opens -----
    async function initialLoad() {
        // Set a friendly loading message
        factArea.innerHTML = "🐶 Fetching first fun dog fact... 🐾";
        statusMsg.innerText = "Welcome! Getting a cool dog picture and fact!";
        try {
            // Load an image and fact separately but show soon
            const [firstImage, firstFact] = await Promise.all([
                fetchRandomDogImage(),
                fetchRandomDogFact()
            ]);
            if (firstImage) dogImage.src = firstImage;
            if (firstFact) factArea.innerHTML = `🐕 ${firstFact}`;
            else factArea.innerHTML = "🐕 Did you know? Dogs have 3 eyelids! That's a cool fact!";
        } catch (err) {
            console.log("initial gentle load used fallback");
            factArea.innerHTML = "🐕 Click the big button to see amazing dogs & facts!";
        } finally {
            statusMsg.innerText = "✨ Ready! Hit the big button for magic ✨";
            setTimeout(() => {
                if (statusMsg.innerText === "✨ Ready! Hit the big button for magic ✨") {
                    statusMsg.innerText = "";
                }
            }, 3000);
        }
    }

    // Add event listener to the button
    fetchButton.addEventListener('click', () => {
        refreshDogContent();
    });

    // When page loads, we call initialLoad to show nice content (not empty)
    initialLoad();

    // Also, make a nice hover effect on button and bonus: the image update
    // All super beginner-friendly, 5th grader can inspect and see fetch calls.
    // No complex keys or signups!
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>AppForge — Build & Export HTML Apps</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f1117;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 32px;
      padding: 20px 28px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fbbf24, #f97316, #ef4444);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo p {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #fbbf24, #f97316);
      color: #0f172a;
      border: none;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(251, 191, 36, 0.3);
    }
    .btn-secondary {
      background: rgba(51, 65, 85, 0.6);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 10px 18px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.8);
    }
    .btn-export {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid #34d399;
      color: #34d399;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }
    .btn-export:hover {
      background: rgba(52, 211, 153, 0.25);
      transform: translateY(-2px);
    }
    .btn-fullscreen {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid #fbbf24;
      color: #fbbf24;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }
    .btn-fullscreen:hover {
      background: rgba(251, 191, 36, 0.25);
      transform: translateY(-2px);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 1100px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: rgba(26, 30, 44, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 22px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fbbf24;
    }

    .builder-section {
      margin-bottom: 16px;
    }
    .builder-section label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .builder-section input, .builder-section textarea, .builder-section select {
      width: 100%;
      background: rgba(15, 17, 23, 0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .builder-section input:focus, .builder-section textarea:focus {
      outline: none;
      border-color: #fbbf24;
    }
    .builder-section textarea {
      resize: vertical;
      min-height: 50px;
    }

    .component-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      max-height: 120px;
      overflow-y: auto;
    }
    .component-chip {
      background: rgba(51, 65, 85, 0.5);
      padding: 5px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .component-chip:hover {
      background: rgba(251, 191, 36, 0.15);
      border-color: #fbbf24;
    }
    .component-chip.active {
      background: rgba(251, 191, 36, 0.2);
      border-color: #fbbf24;
    }

    .component-types {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
      margin-bottom: 12px;
    }
    .type-btn {
      background: rgba(51, 65, 85, 0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      color: #e2e8f0;
      font-size: 0.7rem;
    }
    .type-btn:hover {
      background: rgba(251, 191, 36, 0.1);
      border-color: #fbbf24;
    }
    .type-btn .emoji {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 2px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 10px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 6px 16px;
      color: #94a3b8;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      border-radius: 40px;
      transition: 0.2s;
      font-size: 0.8rem;
    }
    .tab-btn.active {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .preview-wrapper {
      position: relative;
      background: #0a0c10;
      border-radius: 24px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-frame {
      width: 100%;
      max-width: 500px;
      background: #0f1117;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.3s ease;
      margin: 0 auto;
    }
    .device-frame {
      position: relative;
    }
    .device-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f1117;
      width: 120px;
      height: 24px;
      border-radius: 0 0 16px 16px;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.05);
      border-top: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .device-notch .camera {
      width: 8px;
      height: 8px;
      background: #1a1a2e;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .device-notch .speaker {
      width: 40px;
      height: 4px;
      background: #1a1a2e;
      border-radius: 4px;
    }
    .preview-content {
      padding: 20px;
      min-height: 400px;
      max-height: 700px;
      overflow-y: auto;
    }
    .preview-empty {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .preview-empty .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .preview-empty h3 {
      font-size: 1.2rem;
      color: #94a3b8;
    }

    .fullscreen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0c10;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .fullscreen-overlay.active {
      display: flex;
    }
    .fullscreen-overlay .close-fullscreen {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 60px;
      padding: 10px 20px;
      color: #e2e8f0;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      z-index: 10000;
      transition: 0.2s;
    }
    .fullscreen-overlay .close-fullscreen:hover {
      background: rgba(255,255,255,0.2);
    }
    .fullscreen-overlay .fullscreen-app {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      background: #0f1117;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .fullscreen-overlay .fullscreen-app .fullscreen-content {
      padding: 24px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .fullscreen-overlay .device-notch-full {
      padding: 12px 0 0 0;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .fullscreen-overlay .device-notch-full .notch-bar {
      display: inline-block;
      background: #0f1117;
      padding: 4px 40px;
      border-radius: 0 0 16px 16px;
      border: 1px solid rgba(255,255,255,0.05);
      border-top: none;
    }

    .saved-apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .saved-app-card {
      background: rgba(26, 30, 44, 0.6);
      border-radius: 18px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: 0.2s;
    }
    .saved-app-card:hover {
      border-color: #fbbf24;
      transform: translateY(-2px);
    }
    .saved-app-card .app-name {
      font-weight: 700;
      font-size: 0.85rem;
    }
    .saved-app-card .app-meta {
      font-size: 0.65rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .saved-app-card .delete-app {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      float: right;
      font-size: 0.7rem;
    }
    .saved-app-card .delete-app:hover {
      color: #ef4444;
    }

    @media (max-width: 700px) {
      .app-container { padding: 12px; }
      .header { flex-direction: column; text-align: center; padding: 16px; }
      .main-grid { gap: 16px; }
      .panel { padding: 16px; }
      .fullscreen-overlay .fullscreen-app { max-width: 100%; border-radius: 24px; }
    }
  </style>
</head>
<body>
<div class="app-container">
  
  <div class="header">
    <div class="logo">
      <h1>⚡ AppForge</h1>
      <p>Build & export multimedia apps</p>
    </div>
    <div class="header-actions">
      <button class="btn-export" id="exportHtmlBtn">📄 Export HTML</button>
      <button class="btn-fullscreen" id="fullscreenBtn">📱 Full Screen</button>
      <button class="btn-primary" id="saveAppBtn">💾 Save</button>
      <button class="btn-secondary" id="exportBtn">📤 JSON</button>
    </div>
  </div>

  <div class="main-grid">
    <!-- BUILDER -->
    <div class="panel">
      <div class="panel-title">🛠️ App Builder</div>
      
      <div class="builder-section">
        <label>App Name</label>
        <input type="text" id="appName" value="My Multimedia App" placeholder="App name">
      </div>

      <div class="builder-section">
        <label>App Description</label>
        <input type="text" id="appDesc" value="A beautiful multimedia experience" placeholder="Description">
      </div>

      <div class="builder-section">
        <label>Theme Color</label>
        <input type="color" id="themeColor" value="#fbbf24" style="padding: 4px; height: 40px;">
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="components">🧩 Components</button>
        <button class="tab-btn" data-tab="layout">📐 Layout</button>
        <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
      </div>

      <div class="tab-content active" id="tab-components">
        <div class="component-types">
          <div class="type-btn" data-type="text"><span class="emoji">📝</span>Text</div>
          <div class="type-btn" data-type="image"><span class="emoji">🖼️</span>Image</div>
          <div class="type-btn" data-type="video"><span class="emoji">🎬</span>Video</div>
          <div class="type-btn" data-type="audio"><span class="emoji">🎵</span>Audio</div>
          <div class="type-btn" data-type="button"><span class="emoji">🔘</span>Button</div>
          <div class="type-btn" data-type="card"><span class="emoji">🃏</span>Card</div>
          <div class="type-btn" data-type="gallery"><span class="emoji">🖼️</span>Gallery</div>
        </div>

        <div class="builder-section">
          <label>Component Settings</label>
          <div id="componentSettings">
            <div style="color: #94a3b8; font-size: 0.8rem; padding: 8px;">
              Select a component type above to add it to your app.
            </div>
          </div>
        </div>

        <div class="builder-section">
          <label>Components (<span id="componentCount">0</span>)</label>
          <div id="componentList" class="component-list">
            <span style="color: #64748b; font-size: 0.8rem;">No components yet.</span>
          </div>
        </div>
      </div>

      <div class="tab-content" id="tab-layout">
        <div class="builder-section">
          <label>Layout Style</label>
          <select id="layoutStyle">
            <option value="grid">Grid</option>
            <option value="list">List</option>
            <option value="cards">Cards</option>
            <option value="magazine">Magazine</option>
          </select>
        </div>
        <div class="builder-section">
          <label>Columns: <span id="columnsLabel">2</span></label>
          <input type="range" id="layoutColumns" min="1" max="4" value="2" style="width: 100%;">
        </div>
        <div class="builder-section">
          <label>Background</label>
          <select id="bgStyle">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="gradient">Gradient</option>
            <option value="glass">Glassmorphism</option>
          </select>
        </div>
      </div>

      <div class="tab-content" id="tab-settings">
        <div class="builder-section">
          <label>Font</label>
          <select id="fontFamily">
            <option value="Inter">Inter</option>
            <option value="system">System</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
          </select>
        </div>
        <div class="builder-section">
          <label>Font Size: <span id="fontSizeLabel">16px</span></label>
          <input type="range" id="fontSize" min="12" max="24" value="16" style="width: 100%;">
        </div>
        <div class="builder-section">
          <label>Border Radius: <span id="borderRadiusLabel">16px</span></label>
          <input type="range" id="borderRadius" min="4" max="32" value="16" style="width: 100%;">
        </div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="panel">
      <div class="panel-title">📱 App Preview</div>
      <div class="preview-wrapper">
        <div class="preview-frame" id="previewFrame">
          <div class="device-frame">
            <div class="device-notch">
              <span class="camera"></span>
              <span class="speaker"></span>
            </div>
            <div class="preview-content" id="previewContent">
              <div class="preview-empty">
                <div class="icon">📱</div>
                <h3>Your App Preview</h3>
                <p style="font-size: 0.85rem;">Add components to see your app come to life</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Saved Apps -->
  <div class="panel" style="margin-top: 20px;">
    <div class="panel-title">📚 Saved Apps</div>
    <div id="savedAppsContainer">
      <div class="saved-apps-grid" id="savedAppsGrid">
        <span style="color: #64748b; font-size: 0.85rem; grid-column: 1 / -1; text-align: center; padding: 20px;">
          No saved apps yet.
        </span>
      </div>
    </div>
  </div>
</div>

<!-- FULLSCREEN OVERLAY -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
  <button class="close-fullscreen" id="closeFullscreen">✕ Close Preview</button>
  <div class="fullscreen-app" id="fullscreenApp">
    <div class="device-notch-full">
      <div class="notch-bar">
        <span style="display: inline-flex; gap: 8px; align-items: center;">
          <span style="width: 8px; height: 8px; background: #1a1a2e; border-radius: 50%; display: inline-block;"></span>
          <span style="width: 40px; height: 4px; background: #1a1a2e; border-radius: 4px; display: inline-block;"></span>
        </span>
      </div>
    </div>
    <div class="fullscreen-content" id="fullscreenContent"></div>
  </div>
</div>

<script>
  // ---------- APPFORGE WITH HTML EXPORT ----------
  let components = [];
  let componentIdCounter = 0;
  let editingComponentId = null;
  let savedApps = JSON.parse(localStorage.getItem('appforge_apps') || '[]');

  const componentTemplates = {
    text: {
      label: 'Text',
      fields: [
        { key: 'content', label: 'Text Content', type: 'textarea', default: 'This is a text component. Edit me!' },
        { key: 'align', label: 'Alignment', type: 'select', options: ['left', 'center', 'right'], default: 'center' },
        { key: 'size', label: 'Size', type: 'select', options: ['small', 'medium', 'large'], default: 'medium' }
      ]
    },
    image: {
      label: 'Image',
      fields: [
        { key: 'url', label: 'Image URL', type: 'text', default: 'https://picsum.photos/seed/1/400/300' },
        { key: 'alt', label: 'Alt Text', type: 'text', default: 'Beautiful image' },
        { key: 'caption', label: 'Caption', type: 'text', default: '' }
      ]
    },
    video: {
      label: 'Video',
      fields: [
        { key: 'url', label: 'Video URL', type: 'text', default: 'https://www.w3schools.com/html/mov_bbb.mp4' },
        { key: 'controls', label: 'Show Controls', type: 'checkbox', default: true }
      ]
    },
    audio: {
      label: 'Audio',
      fields: [
        { key: 'url', label: 'Audio URL', type: 'text', default: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
        { key: 'loop', label: 'Loop', type: 'checkbox', default: false }
      ]
    },
    button: {
      label: 'Button',
      fields: [
        { key: 'text', label: 'Button Text', type: 'text', default: 'Click Me' },
        { key: 'action', label: 'Action', type: 'select', options: ['alert', 'link', 'none'], default: 'alert' },
        { key: 'link', label: 'Link URL (if action=link)', type: 'text', default: 'https://example.com' }
      ]
    },
    card: {
      label: 'Card',
      fields: [
        { key: 'title', label: 'Card Title', type: 'text', default: 'Card Title' },
        { key: 'content', label: 'Card Content', type: 'textarea', default: 'This is a card component. Perfect for displaying content.' },
        { key: 'image', label: 'Card Image URL', type: 'text', default: 'https://picsum.photos/seed/2/400/200' }
      ]
    },
    gallery: {
      label: 'Gallery',
      fields: [
        { key: 'images', label: 'Image URLs (comma separated)', type: 'text', default: 'https://picsum.photos/seed/3/200/200,https://picsum.photos/seed/4/200/200,https://picsum.photos/seed/5/200/200' },
        { key: 'cols', label: 'Columns', type: 'number', default: 3 }
      ]
    }
  };

  function addComponent(type) {
    const template = componentTemplates[type];
    if (!template) return;
    const newComponent = {
      id: componentIdCounter++,
      type: type,
      label: template.label,
      data: {}
    };
    template.fields.forEach(field => {
      newComponent.data[field.key] = field.default !== undefined ? field.default : '';
    });
    components.push(newComponent);
    renderComponentList();
    renderComponentSettings();
    updatePreview();
  }

  function deleteComponent(id) {
    components = components.filter(c => c.id !== id);
    if (editingComponentId === id) editingComponentId = null;
    renderComponentList();
    renderComponentSettings();
    updatePreview();
  }

  function renderComponentList() {
    const list = document.getElementById('componentList');
    const count = document.getElementById('componentCount');
    if (components.length === 0) {
      list.innerHTML = '<span style="color: #64748b; font-size: 0.8rem;">No components yet.</span>';
      count.textContent = '0';
      return;
    }
    count.textContent = components.length;
    list.innerHTML = components.map(c => `
      <div class="component-chip ${editingComponentId === c.id ? 'active' : ''}" onclick="editComponent(${c.id})">
        ${c.label} ${c.type === 'image' ? '🖼️' : c.type === 'video' ? '🎬' : c.type === 'audio' ? '🎵' : c.type === 'button' ? '🔘' : c.type === 'card' ? '🃏' : c.type === 'gallery' ? '🖼️' : '📝'}
        <span onclick="event.stopPropagation(); deleteComponent(${c.id})" style="margin-left: 4px; cursor: pointer; color: #64748b;">✕</span>
      </div>
    `).join('');
  }

  function editComponent(id) {
    editingComponentId = id;
    renderComponentList();
    renderComponentSettings();
  }

  function renderComponentSettings() {
    const container = document.getElementById('componentSettings');
    const component = components.find(c => c.id === editingComponentId);
    if (!component) {
      container.innerHTML = `<div style="color: #94a3b8; font-size: 0.8rem; padding: 8px;">Select a component to edit.</div>`;
      return;
    }
    const template = componentTemplates[component.type];
    let html = `<div style="background: rgba(15,17,23,0.5); border-radius: 14px; padding: 12px; margin-bottom: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <strong style="font-size: 0.85rem;">${template.label}</strong>
        <button class="btn-secondary" onclick="deleteComponent(${component.id})" style="padding: 4px 12px; font-size: 0.7rem;">Delete</button>
      </div>
    `;
    template.fields.forEach(field => {
      const value = component.data[field.key] || '';
      const label = `<label style="font-size: 0.65rem; color: #94a3b8; display: block; margin-bottom: 3px;">${field.label}</label>`;
      if (field.type === 'textarea') {
        html += `<div style="margin-bottom: 10px;">${label}<textarea onchange="updateComponentData(${component.id}, '${field.key}', this.value)" style="width: 100%; background: rgba(15,17,23,0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 6px 10px; color: #e2e8f0; font-family: inherit; resize: vertical; min-height: 50px; font-size: 0.8rem;">${value}</textarea></div>`;
      } else if (field.type === 'checkbox') {
        html += `<div style="margin-bottom: 10px;">${label}<input type="checkbox" ${value ? 'checked' : ''} onchange="updateComponentData(${component.id}, '${field.key}', this.checked)" style="width: 18px; height: 18px; accent-color: #fbbf24;"></div>`;
      } else if (field.type === 'select') {
        html += `<div style="margin-bottom: 10px;">${label}<select onchange="updateComponentData(${component.id}, '${field.key}', this.value)" style="width: 100%; background: rgba(15,17,23,0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 6px 10px; color: #e2e8f0; font-family: inherit; font-size: 0.8rem;">${field.options.map(opt => `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`).join('')}</select></div>`;
      } else {
        html += `<div style="margin-bottom: 10px;">${label}<input type="text" value="${value}" onchange="updateComponentData(${component.id}, '${field.key}', this.value)" style="width: 100%; background: rgba(15,17,23,0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 6px 10px; color: #e2e8f0; font-family: inherit; font-size: 0.8rem;"></div>`;
      }
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function updateComponentData(id, key, value) {
    const component = components.find(c => c.id === id);
    if (component) {
      component.data[key] = value;
      updatePreview();
      renderComponentSettings();
    }
  }

  // Generate the app HTML (used for preview and export)
  function generateAppHTML(includeWrapper = true) {
    const name = document.getElementById('appName').value || 'My App';
    const desc = document.getElementById('appDesc').value || 'Multimedia experience';
    const color = document.getElementById('themeColor').value || '#fbbf24';
    const layout = document.getElementById('layoutStyle').value;
    const columns = parseInt(document.getElementById('layoutColumns').value) || 2;
    const bgStyle = document.getElementById('bgStyle').value;
    const fontFamily = document.getElementById('fontFamily').value;
    const fontSize = parseInt(document.getElementById('fontSize').value) || 16;
    const borderRadius = parseInt(document.getElementById('borderRadius').value) || 16;

    let bgStyles = '';
    if (bgStyle === 'dark') bgStyles = 'background: #0f1117;';
    else if (bgStyle === 'light') bgStyles = 'background: #f8fafc; color: #0f172a;';
    else if (bgStyle === 'gradient') bgStyles = 'background: linear-gradient(135deg, #1a1a2e, #16213e);';
    else if (bgStyle === 'glass') bgStyles = 'background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);';

    let gridStyles = `display: grid; grid-template-columns: repeat(${Math.min(columns, 4)}, 1fr); gap: 16px;`;

    let componentsHtml = components.map(c => {
      const data = c.data;
      let html = `<div class="component" style="background: rgba(26,30,44,0.3); border-radius: ${borderRadius}px; padding: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05);">`;
      html += `<div style="font-size: 0.6rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px;">${c.label}</div>`;

      switch(c.type) {
        case 'text':
          const size = data.size === 'large' ? '1.3rem' : data.size === 'small' ? '0.85rem' : '1rem';
          html += `<div style="text-align: ${data.align || 'center'}; font-size: ${size}; padding: 4px;">${data.content || 'Text content'}</div>`;
          break;
        case 'image':
          html += `<img src="${data.url || 'https://picsum.photos/seed/1/400/300'}" alt="${data.alt || 'Image'}" style="width: 100%; border-radius: 10px;">`;
          if (data.caption) html += `<div style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px; text-align: center;">${data.caption}</div>`;
          break;
        case 'video':
          html += `<video src="${data.url || 'https://www.w3schools.com/html/mov_bbb.mp4'}" ${data.controls ? 'controls' : ''} style="width: 100%; border-radius: 10px;"></video>`;
          break;
        case 'audio':
          html += `<audio src="${data.url || 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'}" ${data.loop ? 'loop' : ''} controls style="width: 100%;"></audio>`;
          break;
        case 'button':
          const action = data.action === 'alert' ? `alert('Button clicked!')` : data.action === 'link' ? `window.open('${data.link || '#'}')` : '';
          html += `<button onclick="${action}" style="background: ${color}; color: #0f172a; border: none; padding: 8px 20px; border-radius: 60px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.85rem;">${data.text || 'Click Me'}</button>`;
          break;
        case 'card':
          html += `<div style="background: rgba(26,30,44,0.5); border-radius: ${borderRadius}px; padding: 12px; border: 1px solid rgba(255,255,255,0.05);">
            ${data.image ? `<img src="${data.image}" style="width: 100%; border-radius: 10px; margin-bottom: 8px;">` : ''}
            <h4 style="color: ${color}; margin-bottom: 4px; font-size: 1rem;">${data.title || 'Card Title'}</h4>
            <p style="font-size: 0.85rem; color: #94a3b8;">${data.content || 'Card content'}</p>
          </div>`;
          break;
        case 'gallery':
          const images = (data.images || '').split(',').filter(s => s.trim());
          const cols = parseInt(data.cols) || 3;
          html += `<div style="display: grid; grid-template-columns: repeat(${Math.min(cols, 4)}, 1fr); gap: 6px;">
            ${images.map(img => `<img src="${img.trim()}" style="width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px;">`).join('')}
          </div>`;
          break;
      }
      html += '</div>';
      return html;
    }).join('');

    if (components.length === 0) {
      componentsHtml = `<div style="text-align: center; padding: 40px; color: #64748b;"><div style="font-size: 3rem; margin-bottom: 12px;">📱</div><h3>${name}</h3><p style="font-size: 0.85rem;">Add components to build your app</p></div>`;
    }

    const content = `
      <div style="font-family: '${fontFamily}', sans-serif; ${bgStyles} padding: 16px; border-radius: ${borderRadius}px; min-height: 400px;">
        <div style="background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: ${borderRadius}px; padding: 16px; margin-bottom: 16px; text-align: center;">
          <h2 style="color: ${color}; font-size: 1.6rem; font-weight: 800;">${name}</h2>
          <p style="color: #94a3b8; font-size: 0.85rem;">${desc}</p>
        </div>
        <div style="${gridStyles}">
          ${componentsHtml}
        </div>
      </div>
    `;

    if (!includeWrapper) return content;

    // Full standalone HTML document
    return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>${name}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; min-height: 100vh; }
    .app-content { max-width: 800px; margin: 0 auto; padding: 16px; }
    .component { margin-bottom: 12px; }
    img, video { max-width: 100%; }
  </style>
</head>
<body>
  <div class="app-content">
    ${content}
  </div>
</body>
</html>`;
  }

  function buildAppHTML(containerId) {
    document.getElementById(containerId).innerHTML = generateAppHTML(false);
  }

  function updatePreview() {
    buildAppHTML('previewContent');
  }

  function updateFullscreenPreview() {
    buildAppHTML('fullscreenContent');
  }

  // ---- EXPORT HTML ----
  function exportHTML() {
    if (components.length === 0) {
      alert('Add at least one component to export your app!');
      return;
    }
    const fullHTML = generateAppHTML(true);
    const blob = new Blob([fullHTML], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const name = document.getElementById('appName').value.trim() || 'my-app';
    a.href = url;
    a.download = `${name.replace(/\s/g, '_')}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---- Save/Load/Export JSON ----
  function saveApp() {
    const name = document.getElementById('appName').value.trim() || 'My App';
    if (components.length === 0) {
      alert('Add at least one component to save your app!');
      return;
    }
    const appData = {
      id: Date.now(),
      name: name,
      desc: document.getElementById('appDesc').value.trim(),
      color: document.getElementById('themeColor').value,
      layout: document.getElementById('layoutStyle').value,
      columns: parseInt(document.getElementById('layoutColumns').value) || 2,
      bgStyle: document.getElementById('bgStyle').value,
      fontFamily: document.getElementById('fontFamily').value,
      fontSize: parseInt(document.getElementById('fontSize').value) || 16,
      borderRadius: parseInt(document.getElementById('borderRadius').value) || 16,
      components: components.map(c => ({ ...c })),
      savedAt: new Date().toISOString()
    };
    savedApps.push(appData);
    localStorage.setItem('appforge_apps', JSON.stringify(savedApps));
    renderSavedApps();
    const btn = document.getElementById('saveAppBtn');
    btn.textContent = '✅ Saved!';
    setTimeout(() => { btn.innerHTML = '💾 Save'; }, 2000);
  }

  function loadApp(id) {
    const app = savedApps.find(a => a.id === id);
    if (!app) return;
    document.getElementById('appName').value = app.name;
    document.getElementById('appDesc').value = app.desc || '';
    document.getElementById('themeColor').value = app.color || '#fbbf24';
    document.getElementById('layoutStyle').value = app.layout || 'grid';
    document.getElementById('layoutColumns').value = app.columns || 2;
    document.getElementById('columnsLabel').textContent = app.columns || 2;
    document.getElementById('bgStyle').value = app.bgStyle || 'dark';
    document.getElementById('fontFamily').value = app.fontFamily || 'Inter';
    document.getElementById('fontSize').value = app.fontSize || 16;
    document.getElementById('fontSizeLabel').textContent = (app.fontSize || 16) + 'px';
    document.getElementById('borderRadius').value = app.borderRadius || 16;
    document.getElementById('borderRadiusLabel').textContent = (app.borderRadius || 16) + 'px';
    components = app.components.map(c => ({ ...c }));
    componentIdCounter = Math.max(...components.map(c => c.id), 0) + 1;
    renderComponentList();
    renderComponentSettings();
    updatePreview();
    renderSavedApps();
  }

  function deleteSavedApp(id, event) {
    if (event) event.stopPropagation();
    if (confirm('Delete this saved app?')) {
      savedApps = savedApps.filter(a => a.id !== id);
      localStorage.setItem('appforge_apps', JSON.stringify(savedApps));
      renderSavedApps();
    }
  }

  function renderSavedApps() {
    const grid = document.getElementById('savedAppsGrid');
    if (savedApps.length === 0) {
      grid.innerHTML = `<span style="color: #64748b; font-size: 0.85rem; grid-column: 1 / -1; text-align: center; padding: 20px;">No saved apps yet.</span>`;
      return;
    }
    grid.innerHTML = savedApps.map(a => `
      <div class="saved-app-card" onclick="loadApp(${a.id})">
        <span class="delete-app" onclick="deleteSavedApp(${a.id}, event)">✕</span>
        <div class="app-name">${a.name}</div>
        <div class="app-meta">${a.components.length} components • ${new Date(a.savedAt).toLocaleDateString()}</div>
      </div>
    `).join('');
  }

  function exportJSON() {
    if (components.length === 0) { alert('Add components to export!'); return; }
    const data = {
      name: document.getElementById('appName').value.trim() || 'My App',
      desc: document.getElementById('appDesc').value.trim(),
      color: document.getElementById('themeColor').value,
      layout: document.getElementById('layoutStyle').value,
      columns: parseInt(document.getElementById('layoutColumns').value) || 2,
      bgStyle: document.getElementById('bgStyle').value,
      fontFamily: document.getElementById('fontFamily').value,
      fontSize: parseInt(document.getElementById('fontSize').value) || 16,
      borderRadius: parseInt(document.getElementById('borderRadius').value) || 16,
      components: components.map(c => ({ ...c })),
      exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${data.name.replace(/\s/g, '_')}_app.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ---- Fullscreen ----
  function openFullscreen() {
    document.getElementById('fullscreenOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
    updateFullscreenPreview();
  }

  function closeFullscreen() {
    document.getElementById('fullscreenOverlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  // ---- Event listeners ----
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => addComponent(btn.dataset.type));
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    });
  });

  document.getElementById('layoutColumns').addEventListener('input', (e) => {
    document.getElementById('columnsLabel').textContent = e.target.value;
    updatePreview();
  });
  document.getElementById('fontSize').addEventListener('input', (e) => {
    document.getElementById('fontSizeLabel').textContent = e.target.value + 'px';
    updatePreview();
  });
  document.getElementById('borderRadius').addEventListener('input', (e) => {
    document.getElementById('borderRadiusLabel').textContent = e.target.value + 'px';
    updatePreview();
  });

  document.querySelectorAll('#layoutStyle, #bgStyle, #fontFamily').forEach(el => {
    el.addEventListener('change', updatePreview);
  });
  document.querySelectorAll('#appName, #appDesc, #themeColor').forEach(el => {
    el.addEventListener('input', updatePreview);
  });

  document.getElementById('saveAppBtn').addEventListener('click', saveApp);
  document.getElementById('exportBtn').addEventListener('click', exportJSON);
  document.getElementById('exportHtmlBtn').addEventListener('click', exportHTML);
  document.getElementById('fullscreenBtn').addEventListener('click', openFullscreen);
  document.getElementById('closeFullscreen').addEventListener('click', closeFullscreen);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('fullscreenOverlay').classList.contains('active')) {
      closeFullscreen();
    }
  });

  window.addComponent = addComponent;
  window.deleteComponent = deleteComponent;
  window.editComponent = editComponent;
  window.updateComponentData = updateComponentData;
  window.loadApp = loadApp;
  window.deleteSavedApp = deleteSavedApp;

  renderSavedApps();
  setTimeout(() => {
    addComponent('text');
    addComponent('image');
    addComponent('card');
  }, 300);
</script>
</body>
</html>

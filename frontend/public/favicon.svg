  <path d="M14 44 C14 30 22 22 32 22 C42 22 50 28 50 36 C50 44 42 50 34 50 C27 50 22 46 22 40 C22 34 27 30 33 30 C38 30 41 33 41 37 C41 40 38 42 35 42 C33 42 31 40 31 38"

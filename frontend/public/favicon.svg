  <circle cx="28.5" cy="36" r="2" fill="#fff"/>
  <circle cx="33.5" cy="36" r="2" fill="#fff"/>
  <circle cx="28.9" cy="36.2" r="1" fill="#000"/>
  <circle cx="33.1" cy="36.2" r="1" fill="#000"/>
  <!-- tongue -->

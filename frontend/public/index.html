<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="SnowSnakes — dad jokes, doodles, comics, mini games and the Spread Da Word animated series."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      The Cloudinary upload widget is only needed when someone opens one of the
      submission forms. Loaded synchronously in <head> it blocked the browser
      from rendering anything until a third-party script had downloaded, which
      delayed first paint on every page for every visitor. `defer` keeps it off
      the critical path while still letting it finish long before a user can
      click "upload".
    -->
    <script
      src="https://upload-widget.cloudinary.com/global/all.js"
      type="text/javascript"
      defer
    ></script>
    <title>SnowSnakes</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="modal-root"></div>
  </body>
</html>
